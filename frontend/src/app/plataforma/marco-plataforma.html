<div class="app">
  <aside class="lado">
    <div class="marca">
      <div class="sello">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M5 7h14M7 7l-3 7h6zM17 7l-3 7h6z"/><path d="M4 14a3 3 0 0 0 6 0M14 14a3 3 0 0 0 6 0"/>
        </svg>
      </div>
      <div><b>Iuris</b><span>La plataforma</span></div>
    </div>

    <div class="rot">Plataforma</div>
    <a routerLink="/despachos" routerLinkActive="on">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5V6.2a1.7 1.7 0 0 1 1.7-1.7h6.1a1.7 1.7 0 0 1 1.7 1.7v14.3M13 20.5V11h5.8a1.7 1.7 0 0 1 1.7 1.7v7.8M2 20.5h20M6.8 8.3h2.6M6.8 12h2.6M6.8 15.7h2.6M16.2 14.5h1.3"/></svg>
      Despachos
    </a>

    <div class="rot">Cuenta</div>
    <a routerLink="/plataforma/mi-cuenta" routerLinkActive="on">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
      Mi cuenta
    </a>

    <!--
      RN-10 en la propia barra lateral. El menú es corto, y sin explicación
      alguien lo leería como «esta pantalla está a medias». No lo está: es el
      límite del rol, escrito donde se ve.
    -->
    <p class="nota-lado">
      Usted administra despachos, no expedientes. El contenido de los procesos
      está bajo reserva profesional y no es accesible desde aquí.
    </p>

    <div class="yo">
      <div class="ini">{{ autenticacion.iniciales() }}</div>
      <div class="quien-soy">
        <b>{{ autenticacion.nombre() }}</b>
        <span>Admin. de Plataforma</span>
      </div>
      <button class="salir" type="button" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h9"/></svg>
      </button>
    </div>
  </aside>

  <div class="cuerpo">
    <router-outlet />
  </div>
</div>
