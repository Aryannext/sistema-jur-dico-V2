<div class="app">
  <aside class="lado">
    <div class="marca">
      <div class="sello">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M5 7h14M7 7l-3 7h6zM17 7l-3 7h6z"/><path d="M4 14a3 3 0 0 0 6 0M14 14a3 3 0 0 0 6 0"/>
        </svg>
      </div>
      <div><b>Iuris</b><span>Portal del cliente</span></div>
    </div>

    <div class="rot">Mi caso</div>
    <a routerLink="/portal/procesos" routerLinkActive="on">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      Mis procesos
    </a>
    <a routerLink="/portal/audiencias" routerLinkActive="on">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      Mis audiencias
    </a>

    <div class="rot">Mi cuenta</div>
    <a routerLink="/portal/mi-cuenta" routerLinkActive="on">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
      Cambiar mi contraseña
    </a>

    @if (perfil(); as p) {
      <!-- Qué despacho lleva su caso. Es lo primero que un cliente necesita
           saber si algo no le cuadra: a quién llamar. -->
      <div class="despacho">
        <span>Su caso lo lleva</span>
        <b>{{ p.despacho }}</b>
      </div>
    }

    <div class="yo">
      <div class="ini">{{ iniciales(autenticacion.nombre()) }}</div>
      <div class="quien-soy">
        <b>{{ autenticacion.nombre() }}</b>
        <span>Cliente</span>
      </div>
      <button class="salir" type="button" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h9"/></svg>
      </button>
    </div>
  </aside>

  <div class="cuerpo">
    <router-outlet />
  </div>
</div>
