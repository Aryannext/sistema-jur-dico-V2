# Perfil de produccion. D-23.
#
# Este fichero NO contiene ningun secreto: todos llegan por variable de
# entorno y sin valor por defecto, de modo que la aplicacion no arranca si
# falta alguno. Es el control 1 de D-23.
#
# Lo que si contiene son los controles que en local estan relajados a
# proposito y aqui dejan de estarlo. Estan fijados, no configurables:
# un control de seguridad que se puede apagar con una variable acaba
# apagado.
#
# Se activa con SGPJ_PERFIL=produccion.

# --- Control 3: TLS ------------------------------------------------
# La aplicacion no termina TLS; lo hace el proxy delante (nginx, Caddy).
# Sin esta linea Spring no se entera de que la peticion original venia por
# https, y entonces genera enlaces http y decide mal sobre la cookie
# segura. Es el olvido clasico al poner algo detras de un proxy.
server.forward-headers-strategy=framework

# La cookie de sesion solo viaja por TLS, y no la puede leer JavaScript.
# Sin secure, basta una peticion http para que la sesion viaje en claro.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
# Lax y no Strict: Strict rompe la vuelta desde un enlace externo -por
# ejemplo el que un abogado abre desde su correo- y el sistema manda
# correos con enlaces. Lax protege del envio cruzado sin romper eso.
server.servlet.session.cookie.same-site=lax

# --- La aplicacion solo escucha en local ---------------------------
# El proxy de delante es la UNICA via de entrada. Sin esta linea Spring
# escucha en 0.0.0.0 y el sistema queda accesible por http://IP:8080,
# saltandose el TLS: la contraseña de un abogado viajaria en claro por la
# red aunque el sitio tenga certificado.
#
# Se descubrio desplegando, no probando: el servicio arrancaba bien, los
# seis controles de D-23 pasaban, y "ss -tlnp" mostraba un asterisco donde
# tenia que decir 127.0.0.1. Ningun control lo miraba.
server.address=${SGPJ_DIRECCION:127.0.0.1}

# --- Control 5: CORS -----------------------------------------------
# VACIO por defecto, y es lo correcto: en el despliegue previsto el mismo
# servidor sirve el frontend y la API, asi que no hay peticion cruzada
# ninguna y no hace falta permitir ningun origen.
#
# Si algun dia el frontend se sirve desde otro dominio, se declaran aqui
# los origenes EXACTOS -nunca "*"-, separados por coma.
sgpj.origenes-permitidos=${SGPJ_ORIGENES:}

# --- Control 6: la clave de cifrado, por entorno -------------------
# Sin valor por defecto. Si falta, AlmacenDocumentosCifrado impide
# arrancar con instrucciones para generarla.
sgpj.documentos.clave=${SGPJ_DOCUMENTOS_CLAVE}

# --- El correo tiene que salir de verdad ---------------------------
# En local el modo es "registro" y las alertas se escriben en el log. Aqui
# eso significaria que ninguna alerta llega a ningun abogado y nadie se
# entera, que es exactamente el fallo que el producto existe para evitar.
sgpj.correo.modo=${SGPJ_CORREO_MODO:smtp}
spring.mail.host=${SGPJ_SMTP_HOST}
spring.mail.port=${SGPJ_SMTP_PUERTO:587}
spring.mail.username=${SGPJ_SMTP_USUARIO}
spring.mail.password=${SGPJ_SMTP_CLAVE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Nada de detalles internos en los errores ----------------------
# Ya esta asi en el fichero comun; se repite aqui porque es el sitio donde
# alguien lo buscaria al revisar el despliegue.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Registro ------------------------------------------------------
# En produccion no se vuelca el SQL: llena el disco y, peor, deja en el
# log los valores de las consultas.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
