# ============================================================
#  Iuris / SGPJ — Configuración común
#
#  Este archivo SÍ se versiona, por lo tanto NO contiene ningún
#  secreto. Las credenciales llegan por variable de entorno o por
#  application-local.properties, que está excluido del repositorio.
#  Ver D-21 (estándar 1) y docs/07-convenciones-de-codigo.md §5.
# ============================================================

spring.application.name=sgpj
spring.profiles.active=${SGPJ_PERFIL:local}

# --- Conexión a la base de datos -----------------------------
# Host, puerto y nombre tienen valor por defecto porque no son secretos.
# Usuario y clave NO tienen valor por defecto: si faltan, la aplicación
# no arranca. Es deliberado — preferimos un fallo ruidoso a una
# credencial escrita en el código.
spring.datasource.url=jdbc:postgresql://${SGPJ_BD_HOST:localhost}:${SGPJ_BD_PUERTO:5432}/${SGPJ_BD_NOMBRE:iuris_sgpj}
spring.datasource.username=${SGPJ_BD_USUARIO}
spring.datasource.password=${SGPJ_BD_CLAVE}

# --- JPA / Hibernate -----------------------------------------
# validate, nunca update ni create: el esquema lo gobierna Flyway.
# Si Hibernate pudiera alterar tablas, el historial de migraciones
# dejaría de reflejar el estado real de la base.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Flyway: única fuente de verdad del esquema --------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- Idioma (D-21, estándar 2) -------------------------------
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Respuestas de error ------------------------------------
# Nunca se expone la traza ni el mensaje interno al cliente.
# El detalle técnico va al registro; el usuario recibe un mensaje claro.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- Documentos (RNF-04, RNF-13) -----------------------------
# La clave NO tiene valor por defecto: si falta, la aplicación no
# arranca. Una clave por defecto estaría publicada en el repositorio,
# y los documentos quedarían cifrados con algo que cualquiera conoce.
sgpj.documentos.directorio=${SGPJ_DOCUMENTOS_DIR:almacen-documentos}
sgpj.documentos.clave=${SGPJ_DOCUMENTOS_CLAVE:}

# RNF-13: 20 MB por archivo. El límite de la petición deja margen para
# los demás campos del formulario multiparte.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# --- Motor de alertas (RF-24, RNF-11) ------------------------
# Barrido cada 5 minutos: RNF-11 admite 15 de desviacion, asi que
# queda margen. Barrer mas a menudo no cuesta nada -casi siempre
# encuentra cero alertas pendientes- y evita que la alerta de 24h
# salga con horas de retraso.
sgpj.alertas.planificador=${SGPJ_ALERTAS_ACTIVO:true}
sgpj.alertas.intervalo-ms=${SGPJ_ALERTAS_INTERVALO:300000}
sgpj.alertas.cron-vencidos=0 5 0 * * *

# Canal de las alertas (D-03).
#   registro = escribe en el log, NO envia. Solo para desarrollo.
#   smtp     = envio real. OBLIGATORIO en el VPS (D-23).
#   fallo    = falla siempre. Para verificar RNF-08.
sgpj.correo.modo=${SGPJ_CORREO_MODO:registro}
sgpj.correo.remitente=${SGPJ_CORREO_REMITENTE:alertas@iuris.co}

# Servidor SMTP. Solo se usa cuando el modo es "smtp".
#
# Sin SGPJ_SMTP_HOST no se crea el JavaMailSender y el sistema arranca
# igual: en desarrollo no hay servidor de correo y exigirlo seria una
# barrera. Si el modo fuera "smtp" sin servidor, se avisa por ERROR al
# arrancar y cada alerta queda marcada FALLIDA -visible, nunca en
# silencio-, pero el resto del sistema sigue en pie: dejar al despacho
# sin acceso a sus expedientes por un fallo de correo seria peor.
#
# spring.mail.host NO se declara aqui, y es a proposito. Spring crea el
# emisor cuando esa propiedad EXISTE, y una linea con valor vacio cuenta
# como existir: declararla asi creaba un emisor sin servidor que fallaba
# con un mensaje de JavaMail en vez del nuestro, y sin el aviso al
# arrancar. Comprobado: con modo=smtp y host vacio no se avisaba nada.
#
# Se define donde corresponde -application-local.properties en local,
# variables de entorno SPRING_MAIL_* en el VPS-, y la contrasena NUNCA
# se escribe en un archivo versionado (D-23, control 1):
#
#     spring.mail.host=smtp.sudominio.co
#     spring.mail.port=587
#     spring.mail.username=...
#     spring.mail.password=...   <- solo por entorno en el VPS
#
spring.mail.properties.mail.smtp.auth=${SGPJ_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SGPJ_SMTP_TLS:true}
# Un barrido no puede quedarse colgado esperando a un servidor caido:
# bloquearia las demas alertas del mismo barrido.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Servidor ------------------------------------------------
server.port=${SGPJ_PUERTO:8080}
server.shutdown=graceful
